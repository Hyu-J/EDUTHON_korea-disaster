<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>영업 현황 대시보드</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg-color: #f4f5f7;
      --card-bg: #ffffff;
      --primary-navy: #1e2a4a;
      --primary-navy-light: #2d3e6b;
      --text-main: #1a1d23;
      --text-sub: #6b7280;
      --border-color: #e5e7eb;
      --shadow: 0 2px 8px rgba(30, 42, 74, 0.08);
      --shadow-hover: 0 6px 20px rgba(30, 42, 74, 0.12);
      --green: #059669;
      --green-bg: #ecfdf5;
      --red: #dc2626;
      --red-bg: #fef2f2;
      --orange: #d97706;
      --orange-bg: #fffbeb;
      --gray-badge: #9ca3af;
      --gray-badge-bg: #f3f4f6;
      --radius: 12px;
      --font-main: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Noto Sans KR', sans-serif;
    }

    @font-face {
      font-family: 'Pretendard';
      src: local('Pretendard'), local('Pretendard Variable');
      font-weight: 400 700;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.5;
      min-height: 100vh;
      padding: 24px;
    }

    .dashboard {
      max-width: 1400px;
      margin: 0 auto;
    }

    /* 헤더 */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      margin-bottom: 28px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border-color);
    }

    .header-left h1 {
      font-size: 28px;
      font-weight: 700;
      color: var(--primary-navy);
      letter-spacing: -0.5px;
    }

    .header-left p {
      font-size: 14px;
      color: var(--text-sub);
      margin-top: 4px;
    }

    .header-right {
      font-size: 14px;
      color: var(--text-sub);
      text-align: right;
    }

    .header-right strong {
      color: var(--text-main);
      font-weight: 600;
    }

    /* KPI 카드 */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 28px;
    }

    .kpi-card {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .kpi-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-hover);
    }

    .kpi-icon {
      font-size: 24px;
      margin-bottom: 8px;
    }

    .kpi-value {
      font-size: 32px;
      font-weight: 700;
      color: var(--primary-navy);
      line-height: 1.2;
      letter-spacing: -0.5px;
    }

    .kpi-label {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 6px;
    }

    .kpi-change {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 13px;
      font-weight: 600;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .kpi-change.positive {
      color: var(--green);
    }

    .kpi-change.negative {
      color: var(--red);
    }

    /* 목표 달성률 진행바 */
    .kpi-progress {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--border-color);
    }

    .progress-bar {
      height: 6px;
      background: var(--border-color);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-fill {
      height: 100%;
      background: var(--primary-navy);
      border-radius: 3px;
      transition: width 0.6s ease;
    }

    .progress-text {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      color: var(--text-sub);
      margin-top: 6px;
    }

    /* 차트 & 담당자 영역 */
    .main-grid {
      display: grid;
      grid-template-columns: 3fr 2fr;
      gap: 20px;
    }

    .panel {
      background: var(--card-bg);
      border-radius: var(--radius);
      padding: 24px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-color);
    }

    .panel-title {
      font-size: 16px;
      font-weight: 600;
      color: var(--primary-navy);
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border-color);
    }

    /* 월별 매출 차트 */
    .chart-container {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      height: 300px;
      padding: 0 12px 24px;
      position: relative;
    }

    .chart-container::before {
      content: '';
      position: absolute;
      left: 0;
      right: 0;
      top: 0;
      bottom: 0;
      background-image: 
        linear-gradient(to right, var(--border-color) 1px, transparent 1px),
        linear-gradient(to top, var(--border-color) 1px, transparent 1px);
      background-size: 100% 40px, 1px 100%;
      pointer-events: none;
    }

    .chart-bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      max-width: 120px;
      position: relative;
      z-index: 1;
    }

    .bar-container {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .chart-bar {
      width: 48px;
      border-radius: 6px 6px 0 0;
      transition: all 0.3s ease;
      position: relative;
    }

    .chart-bar.current-month {
      background: var(--primary-navy);
    }

    .chart-bar.other-month {
      background: #cbd5e1;
    }

    .chart-bar:hover {
      opacity: 0.85;
      transform: scaleY(1.02);
      transform-origin: bottom;
    }

    .bar-value {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 6px;
      white-space: nowrap;
    }

    .bar-label {
      font-size: 12px;
      color: var(--text-sub);
      font-weight: 500;
    }

    .target-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 1px;
      border-top: 2px dashed var(--primary-navy);
      opacity: 0.5;
      z-index: 0;
    }

    .target-label {
      position: absolute;
      right: 12px;
      top: -20px;
      font-size: 11px;
      color: var(--primary-navy);
      font-weight: 600;
      background: var(--card-bg);
      padding: 2px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      z-index: 2;
    }

    /* 담당자별 실적 */
    .rep-list {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .rep-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .rep-item:hover {
      border-color: var(--primary-navy-light);
      box-shadow: var(--shadow);
    }

    .rep-rank {
      width: 32px;
      height: 32px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: var(--text-sub);
      background: var(--card-bg);
      border-radius: 8px;
      border: 1px solid var(--border-color);
      flex-shrink: 0;
    }

    .rep-rank.first {
      background: #fef3c7;
      border-color: #f59e0b;
      color: #92400e;
    }

    .rep-name {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      flex: 1;
    }

    .rep-name .crown {
      margin-left: 6px;
      font-size: 16px;
    }

    .rep-sales {
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-navy);
      white-space: nowrap;
    }

    .rep-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 70px;
      height: 28px;
      padding: 0 12px;
      font-size: 12px;
      font-weight: 700;
      border-radius: 14px;
      white-space: nowrap;
    }

    .rep-badge.green {
      background: var(--green-bg);
      color: var(--green);
    }

    .rep-badge.orange {
      background: var(--orange-bg);
      color: var(--orange);
    }

    .rep-badge.gray {
      background: var(--gray-badge-bg);
      color: var(--gray-badge);
    }

    /* 제품군별 매출 비중 */
    .product-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .product-item {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 16px;
      background: var(--bg-color);
      border-radius: 10px;
      border: 1px solid var(--border-color);
      transition: all 0.2s ease;
    }

    .product-item:hover {
      border-color: var(--primary-navy-light);
      box-shadow: var(--shadow);
    }

    .product-name {
      width: 100px;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-main);
      flex-shrink: 0;
    }

    .product-bar-wrapper {
      flex: 1;
      height: 28px;
      background: var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      position: relative;
    }

    .product-bar {
      height: 100%;
      border-radius: 14px;
      transition: width 0.8s ease-out, opacity 0.2s ease;
    }

    .product-bar.top {
      background: var(--primary-navy);
    }

    .product-bar.other {
      background: #94a3b8;
    }

    .product-item:hover .product-bar {
      opacity: 0.85;
    }

    .product-value {
      width: 130px;
      font-size: 15px;
      font-weight: 700;
      color: var(--primary-navy);
      text-align: right;
      flex-shrink: 0;
    }

    .product-pct {
      width: 55px;
      font-size: 14px;
      font-weight: 600;
      color: var(--text-sub);
      text-align: right;
      flex-shrink: 0;
    }

    /* 반응형 */
    @media (max-width: 1024px) {
      .kpi-grid {
        grid-template-columns: repeat(2, 1fr);
      }
      .main-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      body {
        padding: 16px;
      }
      .kpi-grid {
        grid-template-columns: 1fr;
      }
      .header {
        flex-direction: column;
        align-items: flex-start;
        gap: 12px;
      }
      .header-right {
        text-align: left;
      }
      .chart-container {
        height: 240px;
        overflow-x: auto;
        padding-bottom: 40px;
      }
      .chart-bar-wrapper {
        min-width: 80px;
      }
    }
  </style>
</head>
<body>
  <div class="dashboard">
    <!-- 헤더 -->
    <header class="header">
      <div class="header-left">
        <h1>영업 현황</h1>
        <p>2026년 8월 · 전사 기준</p>
      </div>
      <div class="header-right">
        최종 업데이트 <strong>오늘 09:00</strong>
      </div>
    </header>

    <!-- KPI 카드 4개 -->
    <section class="kpi-grid">
      <article class="kpi-card">
        <div class="kpi-icon">💰</div>
        <div class="kpi-value">4억 2,300만 원</div>
        <div class="kpi-label">이번 달 매출</div>
        <div class="kpi-change positive">▲ 전월 대비 +12.4%</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-icon">🎯</div>
        <div class="kpi-value">84.6%</div>
        <div class="kpi-label">월 목표 달성률</div>
        <div class="kpi-progress">
          <div class="progress-bar">
            <div class="progress-fill" style="width: 84.6%"></div>
          </div>
          <div class="progress-text">
            <span>목표 5억 원</span>
            <span>4억 2,300만 원 달성</span>
          </div>
        </div>
      </article>

      <article class="kpi-card">
        <div class="kpi-icon">🧾</div>
        <div class="kpi-value">1,842건</div>
        <div class="kpi-label">신규 계약 건수</div>
        <div class="kpi-change positive">▲ 전월 대비 +156건</div>
      </article>

      <article class="kpi-card">
        <div class="kpi-icon">👤</div>
        <div class="kpi-value">23만 원</div>
        <div class="kpi-label">평균 객단가</div>
        <div class="kpi-change negative">▼ 전월 대비 -3.1%</div>
      </article>
    </section>

    <!-- 차트 & 담당자 영역 -->
    <section class="main-grid">
      <!-- 월별 매출 추이 -->
      <article class="panel">
        <h2 class="panel-title">최근 6개월 매출 추이</h2>
        <div class="chart-container" id="monthlyChart">
          <!-- JS로 렌더링 -->
        </div>
      </article>

      <!-- 담당자별 실적 -->
      <article class="panel">
        <h2 class="panel-title">담당자별 실적</h2>
        <div class="rep-list" id="repList">
          <!-- JS로 렌더링 -->
        </div>
      </article>
    </section>

    <!-- 제품군별 매출 비중 -->
    <section class="main-grid" style="margin-top: 20px;">
      <article class="panel" style="grid-column: 1 / -1;">
        <h2 class="panel-title">제품군별 매출 비중</h2>
        <div class="product-list" id="productList">
          <!-- JS로 렌더링 -->
        </div>
      </article>
    </section>
  </div>

  <script>
    // 데이터
    const monthlyData = [
      { month: '3월', value: 3.1, label: '3.1억' },
      { month: '4월', value: 3.4, label: '3.4억' },
      { month: '5월', value: 3.2, label: '3.2억' },
      { month: '6월', value: 3.8, label: '3.8억' },
      { month: '7월', value: 3.7, label: '3.7억' },
      { month: '8월', value: 4.2, label: '4.2억' }
    ];

    const repData = [
      { rank: 1, name: '김민재', sales: '1억 1,200만 원', rate: 112 },
      { rank: 2, name: '이서연', sales: '9,800만 원', rate: 98 },
      { rank: 3, name: '박준호', sales: '8,400만 원', rate: 84 },
      { rank: 4, name: '정하은', sales: '6,900만 원', rate: 69 },
      { rank: 5, name: '최도윤', sales: '5,000만 원', rate: 50 }
    ];

    const TARGET_VALUE = 5.0; // 5억
    const MAX_DATA_VALUE = 4.2; // 데이터 중 최대값

    // 제품군별 매출 비중 (금액 내림차순)
    const productData = [
      { name: '소프트웨어', value: 1.8, label: '1억 8,000만 원', pct: 43 },
      { name: '하드웨어', value: 1.23, label: '1억 2,300만 원', pct: 29 },
      { name: '유지보수', value: 0.8, label: '8,000만 원', pct: 19 },
      { name: '기타', value: 0.4, label: '4,000만 원', pct: 9 }
    ];
    const MAX_PRODUCT_VALUE = 1.8; // 가장 큰 값 (소프트웨어)

    // 월별 차트 렌더링
    function renderChart() {
      const container = document.getElementById('monthlyChart');
      const chartHeight = 260; // px, 막대 최대 높이
      const targetRatio = TARGET_VALUE / MAX_DATA_VALUE; // 목표선 위치 비율

      container.innerHTML = `
        <div class="target-line" style="bottom: ${targetRatio * 100}%"></div>
        <div class="target-label" style="bottom: ${targetRatio * 100}%">목표 5억</div>
        ${monthlyData.map((d, i) => `
          <div class="chart-bar-wrapper">
            <div class="bar-container">
              <div class="chart-bar ${i === monthlyData.length - 1 ? 'current-month' : 'other-month'}"
                   style="height: ${(d.value / MAX_DATA_VALUE) * 100}%"></div>
            </div>
            <div class="bar-value">${d.label}</div>
            <div class="bar-label">${d.month}</div>
          </div>
        `).join('')}
      `;
    }

    // 담당자 리스트 렌더링
    function renderRepList() {
      const container = document.getElementById('repList');
      
      container.innerHTML = repData.map(rep => {
        let badgeClass = 'gray';
        if (rep.rate >= 100) badgeClass = 'green';
        else if (rep.rate >= 70) badgeClass = 'orange';

        return `
          <div class="rep-item">
            <div class="rep-rank ${rep.rank === 1 ? 'first' : ''}">${rep.rank}</div>
            <div class="rep-name">
              ${rep.name}
              ${rep.rank === 1 ? '<span class="crown">🏆</span>' : ''}
            </div>
            <div class="rep-sales">${rep.sales}</div>
            <div class="rep-badge ${badgeClass}">${rep.rate}%</div>
          </div>
        `;
      }).join('');
    }

    // 제품군별 매출 비중 렌더링
    function renderProductChart() {
      const container = document.getElementById('productList');
      
      container.innerHTML = productData.map((d, i) => `
        <div class="product-item">
          <div class="product-name">${d.name}</div>
          <div class="product-bar-wrapper">
            <div class="product-bar ${i === 0 ? 'top' : 'other'}" style="width: ${(d.value / MAX_PRODUCT_VALUE) * 100}%"></div>
          </div>
          <div class="product-value">${d.label}</div>
          <div class="product-pct">${d.pct}%</div>
        </div>
      `).join('');
    }

    // 초기화
    renderChart();
    renderRepList();
    renderProductChart();
  </script>
</body>
</html>
